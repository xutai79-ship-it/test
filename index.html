<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>奇异博士：全兼容修复版 (ES5 + Mirror)</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        
        #ui-layer {
            position: absolute; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            padding-bottom: 30px;
            z-index: 10;
        }

        /* 屏幕调试器：用于在没有控制台的设备上查看报错 */
        #debug-console {
            position: absolute; top: 0; left: 0; width: 100%; height: 100px;
            background: rgba(0,0,0,0.5); color: #0f0; font-size: 10px;
            overflow-y: scroll; pointer-events: none; z-index: 9999;
            display: none; /* 默认隐藏，需要时可手动开启或通过代码开启 */
        }

        #start-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 0.5s;
        }

        .start-btn {
            padding: 15px 40px; border: 2px solid #ffaa00; border-radius: 50px;
            background: rgba(255, 170, 0, 0.2); color: #ffaa00;
            font-size: 24px; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; box-shadow: 0 0 30px rgba(255, 170, 0, 0.4);
            /* 移除 animation 避免老设备性能开销 */
        }
        .start-btn:active { transform: scale(0.95); background: rgba(255, 170, 0, 0.5); }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #ffaa00; text-align: center; font-size: 20px; font-weight: bold;
            z-index: 999; display: none;
        }

        .hud-panel {
            background: rgba(20, 5, 0, 0.85); 
            border: 2px solid rgba(255, 180, 0, 0.5);
            border-radius: 40px; padding: 10px 20px;
            text-align: center; transform: scale(0.9); 
            pointer-events: auto; user-select: none; -webkit-user-select: none;
        }

        .control-group { display: inline-flex; flex-direction: column; align-items: center; margin: 0 5px; }
        .group-label { font-size: 10px; color: #aaa; margin-bottom: 4px; font-weight: 700; }
        
        .key-badge {
            display: inline-block; width: 30px; height: 30px; line-height: 30px; border-radius: 8px; margin: 0 2px; 
            color: #fff; background: rgba(255,255,255,0.1); font-weight: 900; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer;
        }
        
        .mode-active { background: #ffcc00; color: #000; box-shadow: 0 0 10px #ff8800; border-color: #fff; }
        .sub-active { background: #00eaff; color: #000; box-shadow: 0 0 10px #00eaff; border-color: #fff; }
        .bg-active { background: #ff3333; color: #fff; box-shadow: 0 0 10px #ff0000; border-color: #fff; }

        .status-text { color: #fff; font-size: 16px; margin-top: 8px; display: block; font-weight: 700; }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/promise-polyfill@8/dist/polyfill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.2/dist/fetch.umd.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="debug-console">DEBUG LOG:<br></div>
    
    <div id="start-overlay">
        <div class="start-btn" id="start-btn">开启魔法传送门</div>
        <div style="margin-top:20px; color:#666; font-size:12px;">点击无反应请检查摄像头权限</div>
    </div>

    <div id="loading">正在加载神经连接...</div>
    <video id="input_video" style="display:none" playsinline webkit-playsinline></video>
    <canvas id="output_canvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-panel">
            <div style="display:flex; align-items:center; justify-content:center;">
                <div class="control-group">
                    <span class="group-label">Mode</span>
                    <div><span id="k1" class="key-badge mode-active">1</span><span id="k2" class="key-badge">2</span></div>
                </div>
                <div class="control-group">
                    <span class="group-label">Effect</span>
                    <div><span id="k3" class="key-badge sub-active">3</span><span id="k4" class="key-badge">4</span><span id="k5" class="key-badge">5</span></div>
                </div>
                <div class="control-group">
                    <span class="group-label">Color</span>
                    <div><span id="kq" class="key-badge mode-active">Q</span><span id="kw" class="key-badge">W</span><span id="ke" class="key-badge">E</span></div>
                </div>
                <div class="control-group">
                    <span class="group-label">Cam</span>
                    <div><span id="k0" class="key-badge">0</span></div>
                </div>
            </div>
            <span id="instruction-text" class="status-text">WAITING...</span>
        </div>
    </div>

<script>
    // ================= DEBUG 工具 =================
    // 自动捕获所有报错显示在屏幕上，解决平板调试难的问题
    var debugConsole = document.getElementById('debug-console');
    function logToScreen(msg) {
        // 取消下面的注释以开启屏幕调试
        // debugConsole.style.display = 'block'; 
        debugConsole.innerHTML += msg + "<br>";
        console.log(msg);
    }
    window.onerror = function(msg, url, line) {
        logToScreen("ERROR: " + msg + " line: " + line);
    };

    // ================= POLYFILLS =================
    // 严谨的 ES5 降级写法，不使用箭头函数
    window.requestAnimationFrame = window.requestAnimationFrame || window.webkitRequestAnimationFrame || window.mozRequestAnimationFrame || function(callback) { window.setTimeout(callback, 1000 / 60); };
    
    if (!navigator.mediaDevices) navigator.mediaDevices = {};
    if (!navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia = function(constraints) {
            var getUserMedia = navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
            if (!getUserMedia) return Promise.reject(new Error('getUserMedia not implemented'));
            return new Promise(function(resolve, reject) {
                getUserMedia.call(navigator, constraints, resolve, reject);
            });
        }
    }

    // ================= 核心变量 =================
    var videoElement = document.getElementById('input_video');
    var canvasElement = document.getElementById('output_canvas');
    var canvasCtx = canvasElement.getContext('2d');
    var loadingDiv = document.getElementById('loading');
    var instructionText = document.getElementById('instruction-text');
    var bgKey = document.getElementById('k0');

    var canvasW, canvasH, globalTime = 0;
    
    // 性能优化架构变量
    var latestHandsData = []; 
    var isAIRunning = false;
    var videoWidth = 640, videoHeight = 480; // 降低初始分辨率以兼容老设备

    var MODE = { STAGE_1: 1, STAGE_2: 2 };
    var currentMode = MODE.STAGE_1;
    var shapeType = 0; 
    var colorType = 0; 
    var particleType = 0; 
    var isBlackBackground = false; 

    // 粒子系统
    var particlePool = [];
    var sparks = [];
    var MAX_PARTICLES = 1500; // 略微降低以适应老设备
    
    // 二阶段状态
    var s2State = 'IDLE';
    var currentRotX = 0, targetRotX = 0, currentRotY = 0, targetRotY = 0;
    var s2Cooldown = 0;
    var disperseStartTime = 0;
    var textAlpha = 0;

    var cachedAssets = {}; 
    var RUNES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    
    var COLOR_THEMES = [
        { name: "奇异金", hue: 35,  glow: '#ffaa00', text: 'rgba(255, 200, 100, 1)' },
        { name: "量子蓝", hue: 190, glow: '#00eaff', text: 'rgba(100, 240, 255, 1)' },
        { name: "猩红煞", hue: 0,   glow: '#ff2200', text: 'rgba(255, 100, 100, 1)' }
    ];

    var PARTICLE_CONFIG = [
        { name: "爱心", text1: "Guess Who?", text2: "Love You! ❤️" },
        { name: "星球", text1: "Universe...", text2: "Beautiful! 🌟" },
        { name: "花朵", text1: "For You...", text2: "Flowers! 🌸" }
    ];

    function resize() { 
        canvasW = window.innerWidth; 
        canvasH = window.innerHeight; 
        canvasElement.width = canvasW; 
        canvasElement.height = canvasH; 
    }
    resize(); window.addEventListener('resize', resize);

    // ================= 缓存生成 (简化版) =================
    // 为老设备移除复杂的预渲染逻辑，直接绘图，或保留最基础的缓存
    // 这里保留原逻辑但确保语法是 ES5
    function createOffscreenCanvas(size) { var c = document.createElement('canvas'); c.width = size; c.height = size; return { canvas: c, ctx: c.getContext('2d'), size: size, half: size/2 }; }
    
    function generateCache() {
        var theme = COLOR_THEMES[colorType];
        // 简单缓存一个圆环，减少老设备初始化卡顿
        var c = createOffscreenCanvas(400); var ctx = c.ctx; ctx.translate(200, 200);
        ctx.strokeStyle = theme.glow; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0,0, 180, 0, Math.PI*2); ctx.stroke();
        cachedAssets['basic_ring'] = c;
        loadingDiv.style.opacity = 0;
    }
    setTimeout(generateCache, 100);

    // ================= 类定义 (ES5 Prototype 写法) =================
    // 为了兼容性，不使用 class 关键字
    
    function MagicHand() {
        this.x = canvasW/2; this.y = canvasH/2;
        this.targetX = canvasW/2; this.targetY = canvasH/2;
        this.opacity = 0; this.active = false;
        this.scale = 1; this.targetScale = 1;
    }
    MagicHand.prototype.update = function() {
        this.x += (this.targetX - this.x) * 0.25;
        this.y += (this.targetY - this.y) * 0.25;
        this.scale += (this.targetScale - this.scale) * 0.1;
        if (this.active) this.opacity += (1 - this.opacity) * 0.15;
        else this.opacity += (0 - this.opacity) * 0.08;
    };
    MagicHand.prototype.setTarget = function(x, y, s) {
        this.active = true; this.targetX = x; this.targetY = y; this.targetScale = s;
    };
    MagicHand.prototype.getDrawPos = function() {
        return { x: this.x, y: this.y, op: this.opacity, scale: this.scale };
    };

    var magicHands = [new MagicHand(), new MagicHand()];

    function StreakParticle(x, y, hue) {
        this.x = x; this.y = y; this.hue = hue; this.life = 1.0;
        var angle = Math.random() * 6.28;
        var speed = 10 + Math.random() * 20;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
    }
    StreakParticle.prototype.update = function() {
        this.x += this.vx; this.y += this.vy; this.life -= 0.05;
    };
    StreakParticle.prototype.draw = function(ctx) {
        ctx.fillStyle = 'hsla(' + this.hue + ', 100%, 50%, ' + this.life + ')';
        ctx.fillRect(this.x, this.y, 4, 4);
    };

    function Particle3D() {
        this.active = false; this.x=0; this.y=0; this.z=0;
        this.tx=0; this.ty=0; this.tz=0;
    }
    Particle3D.prototype.spawn = function(type) {
        this.active = true;
        this.x=0; this.y=0; this.z=0;
        // 简化生成逻辑
        var r = 300; var theta = Math.random() * 6.28;
        this.tx = r * Math.cos(theta);
        this.ty = r * Math.sin(theta);
        this.tz = (Math.random()-0.5) * 200;
    };
    Particle3D.prototype.update = function(isDispersing) {
        if(!this.active) return;
        if(!isDispersing) {
            this.x += (this.tx - this.x) * 0.1;
            this.y += (this.ty - this.y) * 0.1;
            this.z += (this.tz - this.z) * 0.1;
        } else {
            this.x *= 1.1; this.y *= 1.1;
        }
    };
    Particle3D.prototype.draw = function(ctx, cx, cy, hue) {
        if(!this.active) return;
        var scale = 400 / (400 + this.z + 500);
        var x2d = cx + this.x * scale;
        var y2d = cy + this.y * scale;
        ctx.fillStyle = 'hsla(' + hue + ', 100%, 70%, 0.8)';
        ctx.fillRect(x2d, y2d, 3 * scale, 3 * scale);
    };

    for(var i=0; i<MAX_PARTICLES; i++) particlePool.push(new Particle3D());

    // ================= 渲染循环 =================
    function renderLoop() {
        requestAnimationFrame(renderLoop);
        globalTime++;

        // 1. 绘制背景 (修复镜像问题：核心逻辑)
        canvasCtx.globalCompositeOperation = 'source-over';
        
        if (isBlackBackground) {
            canvasCtx.fillStyle = '#000'; canvasCtx.fillRect(0, 0, canvasW, canvasH);
        } else {
            // == 镜像修正开始 ==
            canvasCtx.save();
            // 水平翻转画布：将坐标轴 X 轴反转，原点平移回画布右侧
            canvasCtx.translate(canvasW, 0);
            canvasCtx.scale(-1, 1);
            
            // Cover 算法绘制视频
            var screenRatio = canvasW / canvasH;
            var vidRatio = (videoWidth || 640) / (videoHeight || 480);
            var drawW, drawH, offsetX, offsetY;
            
            if (screenRatio > vidRatio) {
                drawW = canvasW; drawH = canvasW / vidRatio;
                offsetX = 0; offsetY = (canvasH - drawH) / 2;
            } else {
                drawH = canvasH; drawW = canvasH * vidRatio;
                offsetX = (canvasW - drawW) / 2; offsetY = 0;
            }
            
            if (videoElement.readyState >= 2) {
                canvasCtx.drawImage(videoElement, offsetX, offsetY, drawW, drawH);
            }
            canvasCtx.restore(); 
            // == 镜像修正结束 ==
            
            // 绘制蒙层
            canvasCtx.fillStyle = 'rgba(0,0,0,0.6)'; 
            canvasCtx.fillRect(0,0,canvasW,canvasH);
        }

        // 2. 更新手势
        magicHands[0].update();
        magicHands[1].update();
        
        // 3. 绘制阶段一
        if (currentMode === MODE.STAGE_1) {
            canvasCtx.globalCompositeOperation = 'lighter';
            var theme = COLOR_THEMES[colorType];
            
            for(var h=0; h<2; h++) {
                var hand = magicHands[h];
                var pos = hand.getDrawPos();
                if(pos.op > 0.01) {
                    canvasCtx.save();
                    canvasCtx.translate(pos.x, pos.y);
                    // 绘制基础光环
                    var s = pos.scale * 0.5;
                    if(cachedAssets['basic_ring']) {
                        canvasCtx.scale(s, s);
                        canvasCtx.globalAlpha = pos.op;
                        canvasCtx.drawImage(cachedAssets['basic_ring'].canvas, -200, -200);
                    }
                    // 动态绘制符文 (简单版)
                    canvasCtx.beginPath();
                    canvasCtx.rotate(globalTime * 0.05);
                    canvasCtx.strokeStyle = theme.text;
                    canvasCtx.lineWidth = 2;
                    canvasCtx.arc(0, 0, 150, 0, 6.28);
                    canvasCtx.stroke();
                    canvasCtx.restore();

                    // 生成火花
                    if(hand.active) {
                        for(var k=0; k<2; k++) sparks.push(new StreakParticle(pos.x, pos.y, theme.hue));
                    }
                }
            }

            // 绘制火花
            for(var i=sparks.length-1; i>=0; i--) {
                sparks[i].update();
                sparks[i].draw(canvasCtx);
                if(sparks[i].life <= 0) sparks.splice(i, 1);
            }
        } 
        // 4. 绘制阶段二 (粒子)
        else {
            var cx = canvasW/2; var cy = canvasH/2;
            
            // 简单的两手距离检测
            var activeHands = [];
            if(magicHands[0].active) activeHands.push(magicHands[0]);
            if(magicHands[1].active) activeHands.push(magicHands[1]);
            
            if(s2State === 'IDLE' && activeHands.length === 2) {
                s2State = 'STABLE';
                for(var i=0; i<MAX_PARTICLES; i++) particlePool[i].spawn(particleType);
            }
            
            if(s2State === 'STABLE') {
                if(activeHands.length < 2) s2State = 'DISPERSING';
                canvasCtx.globalCompositeOperation = 'lighter';
                for(var i=0; i<MAX_PARTICLES; i++) {
                    particlePool[i].update(false);
                    particlePool[i].draw(canvasCtx, cx, cy, COLOR_THEMES[colorType].hue);
                }
                canvasCtx.globalCompositeOperation = 'source-over';
                instructionText.innerText = "HOLD HANDS";
            }
            else if (s2State === 'DISPERSING') {
                canvasCtx.globalCompositeOperation = 'lighter';
                for(var i=0; i<MAX_PARTICLES; i++) {
                    particlePool[i].update(true);
                    particlePool[i].draw(canvasCtx, cx, cy, COLOR_THEMES[colorType].hue);
                }
                s2Cooldown++;
                if(s2Cooldown > 100) { s2State = 'IDLE'; s2Cooldown = 0; }
                instructionText.innerText = "RELEASE!";
            } else {
                 instructionText.innerText = "Need 2 Hands";
            }
        }
    }

    // ================= AI 循环 (限制频率) =================
    function processAI() {
        if (!isAIRunning) return;
        // 使用 ES5 语法的 Promise 处理
        hands.send({image: videoElement}).then(function() {
            setTimeout(processAI, 60); // 约 15 FPS
        }).catch(function(e) {
            logToScreen("AI ERROR: " + e);
            setTimeout(processAI, 500); // 出错后慢速重试
        });
    }

    function onResults(results) {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            videoWidth = videoElement.videoWidth;
            videoHeight = videoElement.videoHeight;
            
            // 计算裁剪参数 (需与 renderLoop 保持一致)
            var screenRatio = canvasW / canvasH;
            var vidRatio = (videoWidth || 640) / (videoHeight || 480);
            var drawW, drawH, offsetX, offsetY;
            
            if (screenRatio > vidRatio) {
                drawW = canvasW; drawH = canvasW / vidRatio;
                offsetX = 0; offsetY = (canvasH - drawH) / 2;
            } else {
                drawH = canvasH; drawW = canvasH * vidRatio;
                offsetX = (canvasW - drawW) / 2; offsetY = 0;
            }

            var handsFound = [];
            for (var i = 0; i < results.multiHandLandmarks.length; i++) {
                var lm = results.multiHandLandmarks[i];
                var x = lm[9].x; 
                var y = lm[9].y;
                
                // 核心修复：镜像反转坐标
                // 因为我们在 renderLoop 里对视频用了 scale(-1, 1) 翻转
                // MediaPipe 的 selfieMode: true 已经翻转了 x (0-1)。
                // 所以这里直接计算对应的屏幕坐标即可，不需要再次手动 1-x，
                // 除非测试发现方向依然反了。通常 selfieMode=true 配合 drawImage镜像 就正确了。
                // 如果发现依然反向，去掉 selfieMode:true 或在这里做 x = 1-x;
                
                var screenX = x * drawW + offsetX;
                var screenY = y * drawH + offsetY;
                
                // 简单的深度估算
                var dist = Math.sqrt(Math.pow(lm[0].x - lm[9].x, 2) + Math.pow(lm[0].y - lm[9].y, 2));
                var scale = Math.max(0.5, Math.min(2.5, dist / 0.12));
                
                handsFound.push({ x: screenX, y: screenY, scale: scale });
            }

            // 更新到全局变量
            if(handsFound.length > 0) {
                if(handsFound[0]) magicHands[0].setTarget(handsFound[0].x, handsFound[0].y, handsFound[0].scale);
                if(handsFound[1]) magicHands[1].setTarget(handsFound[1].x, handsFound[1].y, handsFound[1].scale);
            } else {
                 magicHands[0].active = false; magicHands[1].active = false;
            }
        } else {
            magicHands[0].active = false; magicHands[1].active = false;
        }
    }

    // ================= 初始化与事件 =================
    var hands = new Hands({
        locateFile: function(file) {
            return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/' + file;
        }
    });
    hands.setOptions({
        maxNumHands: 2,
        modelComplexity: 0, // 降级模型复杂度以适应老设备
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
        selfieMode: true // 开启 MediaPipe 内部镜像
    });
    hands.onResults(onResults);

    // 交互逻辑
    function handleInput(key) {
        var k = key.toLowerCase();
        if (k === '1') { currentMode = MODE.STAGE_1; isBlackBackground = false; }
        if (k === '2') { currentMode = MODE.STAGE_2; isBlackBackground = true; s2State = 'IDLE'; }
        if (k === '3' || k === '4' || k === '5') {
            if(k==='3') shapeType=0; if(k==='4') shapeType=1; if(k==='5') shapeType=2;
            particleType = shapeType;
        }
        if (k === 'q') colorType=0; if(k==='w') colorType=1; if(k==='e') colorType=2;
        if (k === '0') isBlackBackground = !isBlackBackground;
        
        // 更新 UI
        document.getElementById('instruction-text').innerText = "Mode: " + k.toUpperCase();
        if(k === 'q' || k === 'w' || k === 'e') setTimeout(generateCache, 10);
    }

    window.addEventListener('keydown', function(e) { handleInput(e.key); });
    
    // 绑定点击事件 (兼容移动端和鼠标)
    var clickMap = { 'k1': '1', 'k2': '2', 'k3': '3', 'k4': '4', 'k5': '5', 'kq': 'q', 'kw': 'w', 'ke': 'e', 'k0': '0' };
    for (var id in clickMap) {
        var el = document.getElementById(id);
        if (el) {
            (function(keyId) {
                el.addEventListener('touchstart', function(e) { e.preventDefault(); handleInput(clickMap[keyId]); });
                el.addEventListener('click', function(e) { e.preventDefault(); handleInput(clickMap[keyId]); });
            })(id);
        }
    }

    // 启动按钮逻辑
    var startBtn = document.getElementById('start-btn');
    var startOverlay = document.getElementById('start-overlay');
    
    startBtn.addEventListener('click', function() {
        startOverlay.style.opacity = 0;
        setTimeout(function() { startOverlay.style.display = 'none'; }, 500);
        loadingDiv.style.display = 'block';
        logToScreen("Starting camera...");

        navigator.mediaDevices.getUserMedia({ 
            video: { width: 640, height: 480, facingMode: "user" },
            audio: false 
        }).then(function(stream) {
            videoElement.srcObject = stream;
            videoElement.play();
            logToScreen("Camera started.");
            
            // 启动循环
            renderLoop();
            isAIRunning = true;
            processAI();
            loadingDiv.style.display = 'none';
        }).catch(function(err) {
            logToScreen("CAM ERROR: " + err.message);
            alert("无法启动摄像头: " + err.message);
        });
    });

</script>
</body>
</html>
